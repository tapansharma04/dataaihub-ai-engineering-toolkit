[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samyak"
dynamic = ["version"]
description = "AI engineering tooling for building reliable AI applications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "DataAIHub" },
]
keywords = [
  "samyak",
  "ai-engineering",
  "corpus",
  "rag",
  "data-quality",
  "retrieval-augmented-generation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://www.dataaihub.co"
Repository = "https://github.com/tapansharma04/dataaihub-ai-engineering-toolkit"
Issues = "https://github.com/tapansharma04/dataaihub-ai-engineering-toolkit/issues"

[project.scripts]
samyak = "samyak.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/samyak/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/samyak"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/samyak",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
