[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# CANDIDATE PyPI distribution name — verify availability before publishing.
name = "dataaihub-rag-readiness"
version = "0.1.0"
description = "Analyze a local document corpus for RAG readiness before embedding or indexing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "DataAIHub" },
]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "corpus",
  "data-quality",
  "ai-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.dataaihub.co"

[project.scripts]
rag-readiness = "rag_readiness.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_readiness"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/rag_readiness",
  "/tests",
  "/examples",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
