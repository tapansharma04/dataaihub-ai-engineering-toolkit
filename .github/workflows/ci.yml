name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Public API import
        run: |
          python -c "from samyak import AnalysisConfig, AnalysisReport, CorpusPathError, Finding, Severity, __version__, analyze_corpus; assert __version__ == '0.2.0'"
      - name: Tests
        run: pytest
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
